<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EcoPoint Medellín</title>
<meta name="theme-color" content="#2F5D3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: una sola columna tipo app (máx 460px), cabecera fija arriba, navegación fija abajo, pantallas que se intercambian. */
:root{
  --bg:#F2EADB; --surface:#FBF7EE; --sand:#E4D6BC; --line:#DCCDB0;
  --ink:#1E3527; --muted:#6E604B;
  --green:#2F5D3F; --green-2:#4E7F55; --leaf:#93B06E; --brown:#7A5236; --brown-2:#A47650;
  --on-green:#FBF7EE; --shadow:0 1px 2px rgba(60,45,25,.08),0 6px 18px rgba(60,45,25,.08);
  --bin-white:#F7F5EF; --bin-green:#3F8A4E; --bin-black:#2B2A28; --bin-orange:#D9822B;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-note:"Caveat","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15201A; --surface:#1D2C23; --sand:#2C3A30; --line:#33443A;
  --ink:#EFE6D3; --muted:#B9AB90; --green:#7DB487; --green-2:#9CC89B; --leaf:#A8C487; --brown:#D3A47A; --brown-2:#E0B892;
  --on-green:#13201A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --bin-white:#EDEAE0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15201A; --surface:#1D2C23; --sand:#2C3A30; --line:#33443A;
  --ink:#EFE6D3; --muted:#B9AB90; --green:#7DB487; --green-2:#9CC89B; --leaf:#A8C487; --brown:#D3A47A; --brown-2:#E0B892;
  --on-green:#13201A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --bin-white:#EDEAE0; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}

.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;color:var(--green);background:none;border:0;padding:0}
.brand svg{width:30px;height:30px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--green);color:var(--on-green);border:0;border-radius:999px;padding:7px 14px 7px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}

main{flex:1;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.screen{display:flex;flex-direction:column;gap:18px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brown)}
.lead{color:var(--muted);margin:4px 0 0}
.title{font-size:30px}

/* Home */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:200px;display:flex;align-items:flex-end;background:var(--green);color:#FBF7EE;border:0;padding:0;text-align:left;width:100%}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,40,28,0) 25%,rgba(20,40,28,.88))}
.hero .in{position:relative;z-index:1;padding:18px;display:flex;flex-direction:column;gap:6px;width:100%}
.hero h2{font-size:27px}
.hero .go{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:6px;background:#FBF7EE;color:#1E3527;border-radius:999px;padding:10px 16px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:140px;box-shadow:var(--shadow)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--sand);color:var(--green)}
.tile .ic svg{width:26px;height:26px}
.tile b{font-size:18px;line-height:1.2}
.tile span{font-size:14px;color:var(--muted);line-height:1.35}
.tile.wa{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;background:var(--brown);color:#FBF7EE;border:0}
.tile.wa .ic{background:rgba(255,255,255,.16);color:#FBF7EE}
.tile.wa span{color:#F0E3CF}
.note{font-family:var(--f-note);font-size:23px;line-height:1.15;background:#EFE2C2;color:#3B2A1A;padding:14px 16px;border-radius:4px;transform:rotate(-1.2deg);box-shadow:var(--shadow);position:relative}
.note small{display:block;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7A5236;margin-bottom:2px}

/* Map */
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.map{display:block;width:100%;height:auto;touch-action:manipulation}
.map .pin{cursor:pointer}
.map .pin:focus-visible circle{stroke:var(--leaf);stroke-width:4}
.locbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;border:0;text-decoration:none;font-size:16px;min-height:48px}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.brown{background:var(--brown);color:#FBF7EE}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;flex:1;min-width:0}
.msg{font-size:14px;color:var(--muted);width:100%;margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.place{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.place img,.place .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--sand)}
.place b{display:block;font-size:16px;line-height:1.25}
.place small{color:var(--muted);font-size:13px}
.place .d{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.place .done{display:inline-block;margin-left:6px;color:var(--green-2)}
.disclaimer{font-size:13px;color:var(--muted);border-left:3px solid var(--brown-2);padding:2px 0 2px 10px;margin:0}

/* Sheet */
.veil{position:fixed;inset:0;background:rgba(20,28,22,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 12px}
.sheet .photo{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--sand)}
.sheet .photo img{width:100%;height:100%;object-fit:cover}
.sheet .photo .tag{position:absolute;left:10px;bottom:10px;background:rgba(251,247,238,.92);color:#1E3527;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.addr{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.addr svg{width:22px;height:22px;color:var(--brown);flex:none;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sand);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:14px;border:0}
.sheet-body{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 150px}
.closebtn{position:sticky;top:0;float:right;margin-top:10px;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:2}

/* Done */
.done-screen{align-items:center;text-align:center;padding-top:20px}
.done-screen .ring{width:170px;height:170px;color:var(--green-2)}
.done-screen .ring svg{width:100%;height:100%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.done-screen h2{font-size:34px;color:var(--green)}
.done-screen .shot{width:160px;height:160px;border-radius:18px;object-fit:cover;box-shadow:var(--shadow);transform:rotate(2deg);border:5px solid var(--surface)}
.big-plus{font-family:var(--f-display);font-size:44px;color:var(--brown)}

/* Learn */
.player{background:var(--green);color:#FBF7EE;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
:root[data-theme="dark"] .player{background:#24402F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .player{background:#24402F}}
.stage{aspect-ratio:16/11;max-width:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center}
.stage .art{height:46%;display:flex;gap:10px;align-items:flex-end;justify-content:center}
.stage .art svg{height:100%;width:auto}
.stage p{font-size:19px;line-height:1.3;margin:0;max-width:30ch;font-weight:600}
.stage .scene{animation:scene .5s ease}
@keyframes scene{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.stage .startover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,40,28,.35);border:0}
.stage .startover span{width:74px;height:74px;border-radius:50%;background:#FBF7EE;color:#2F5D3F;display:grid;place-items:center}
.stage .startover svg{width:32px;height:32px;margin-left:4px}
.controls{display:flex;align-items:center;gap:12px;padding:10px 14px 14px}
.controls button{background:rgba(255,255,255,.14);border:0;color:#FBF7EE;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.controls svg{width:18px;height:18px}
.bar{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s linear}
.time{font-size:13px;font-variant-numeric:tabular-nums;opacity:.85}
.vids{display:flex;flex-direction:column;gap:10px}
.vid{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.vid.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.vid .th{height:62px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#FBF7EE;position:relative}
.vid .th svg{width:24px;height:24px}
.vid b{display:block;font-size:16px;line-height:1.25}
.vid small{color:var(--muted);font-size:13px}
.vid .ok{color:var(--green-2);font-weight:700}

/* Categories */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 14px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);padding:12px 0;font-size:17px}
.search input:focus{outline:none}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ans{display:flex;gap:12px;align-items:center}
.ans .dot{width:34px;height:40px;flex:none}
.ans b{display:block}
.ans small{color:var(--muted)}
.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.code{border-radius:14px;padding:12px 8px;text-align:center;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;line-height:1.25}
.code svg{width:34px;height:42px}
.code b{font-size:15px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.cat .img{aspect-ratio:3/4;max-width:100%;background:var(--sand);position:relative;overflow:hidden}
.cat .img img{width:100%;height:100%;object-fit:cover}
.cat .img .sv{width:100%;height:100%;display:grid;place-items:center}
.cat .img .sv svg{width:46%;height:auto}
.cat .cap{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.cat .cap b{font-size:17px}
.cat .cap small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);display:inline-block}
.yesno{display:grid;gap:10px}
.yn{border-radius:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.yn h3{font-family:var(--f-body);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.yn ul{margin:0;padding-left:18px}
.yn.y h3{color:var(--green)}
.yn.n h3{color:var(--brown)}
.tip{font-family:var(--f-note);font-size:22px;line-height:1.2;color:var(--brown)}

/* Bot */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:85%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.35}
.bub.me{align-self:flex-end;background:var(--green);color:var(--on-green);border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--sand);border-bottom-left-radius:4px}
.chat .lbl{font-size:12px;color:var(--muted);text-align:center;margin:0}
.qs{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-decoration:none;font-weight:600}
.q svg{width:18px;height:18px;color:var(--brown);flex:none}
.numbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.numbox code{font-size:15px;color:var(--ink);background:var(--sand);padding:3px 8px;border-radius:8px}

/* Me */
.score{display:flex;align-items:center;gap:16px;background:var(--green);color:var(--on-green);border-radius:20px;padding:18px}
.score .n{font-family:var(--f-display);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.score .lv{font-weight:700;font-size:18px}
.prog{height:10px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--leaf)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lvl{text-align:center;font-size:13px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.lvl b{display:block;color:var(--ink);font-size:14px}
.lvl.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:4px}
.gallery img{aspect-ratio:1;max-width:100%;width:100%;object-fit:cover;border-radius:12px}
.gallery figcaption{font-size:12px;color:var(--muted);line-height:1.25}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .wrap{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--green)}
nav.tabs button[aria-current="page"] svg{background:var(--sand);border-radius:10px;padding:2px 10px;width:44px;box-sizing:content-box}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="backBtn" aria-label="Volver" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="brand" id="brandBtn" aria-label="EcoPoint, inicio">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="currentColor"/><path d="M13 23c0-6 5-11 14-11-1 9-5 14-11 14-1 0-2 0-3-.5L11 28" fill="none" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 23c2-2 5-4 8-6" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/></svg>
      <span>EcoPoint</span>
    </button>
    <button class="pill" id="pointsPill" aria-label="Mis puntos">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 19c0-8 5-14 15-15 0 10-6 15-12 15-1 0-2-.2-3-.6"/></svg>
      <span id="pointsN">0</span>
    </button>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap">
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-go="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>GPS</button>

function km(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);
 const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const fmtKm = d=> d<1 ? Math.round(d*1000)+" m" : d.toFixed(1).replace(".",",")+" km";
const mapsUrl = p=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.q);
const dirUrl = p=>"https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lng+"&travelmode=walking";
const waUrl = t=>"https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(t);
function level(n){let i=0;LEVELS.forEach((l,j)=>{if(n>=l[1])i=j});return i;}
function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function addPoints(n){S.points+=n;save();$("#pointsN").textContent=S.points;}

/* ============ NAVEGACIÓN ============ */
function go(r, push=true){
  if(player){ player.stop(); player=null; }
  if(push && r!==route) history.push(route);
  route=r; render();
  window.scrollTo(0,0);
}
function back(){ const r=history.pop()||"home"; go(r,false); }
$("#backBtn").onclick=back;
$("#brandBtn").onclick=()=>{history=[];go("home",false)};
$("#pointsPill").onclick=()=>go("me");
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{history=[];go(b.dataset.go,false)});

function render(){
  $("#pointsN").textContent=S.points;
  $("#backBtn").hidden = route==="home";
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.go===route) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const V={home,map,learn,cats,bot,me,done}[route]||home;
  $("#main").innerHTML='<section class="screen">'+V()+'</section>';
  (after[route]||(()=>{}))();
}

/* ============ MAPA / GPS ============ */
const B={n:6.305,s:6.165,w:-75.640,e:-75.535}, MW=340, MH=440;
const px=(lat,lng)=>[ (lng-B.w)/(B.e-B.w)*MW, (B.n-lat)/(B.n-B.s)*MH ];
function mapSVG(){
  const river=[[6.165,-75.612],[6.185,-75.600],[6.205,-75.588],[6.225,-75.580],[6.245,-75.576],[6.262,-75.572],[6.282,-75.565],[6.305,-75.556]].map(p=>px(...p));
  const rd=river.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const line=(a,b)=>{const p=px(...a),q=px(...b);return `<path d="M${p[0]} ${p[1]}L${q[0]} ${q[1]}" stroke="var(--surface)" stroke-width="5" stroke-linecap="round"/>`};
  const labels=[["LAURELES",6.2465,-75.6020],["BELÉN",6.2235,-75.6075],["EL POBLADO",6.2120,-75.5600],["CENTRO",6.2530,-75.5650],["ROBLEDO",6.2800,-75.6050],["CASTILLA",6.2960,-75.5800],["MANRIQUE",6.2780,-75.5490],["BUENOS AIRES",6.2380,-75.5470],["GUAYABAL",6.2010,-75.5900]]
    .map(l=>{const p=px(l[1],l[2]);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="var(--muted)" opacity=".8">${l[0]}</text>`}).join("");
  let pins="";
  POINTS.forEach(p=>{const [x,y]=px(p.lat,p.lng);const visited=S.visits.some(v=>v.id===p.id);
    pins+=`<g class="pin" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
      <path d="M0 0c-9-11-14-17-14-24a14 14 0 0 1 28 0c0 7-5 13-14 24z" fill="${visited?"var(--green)":"var(--brown)"}" stroke="var(--surface)" stroke-width="2.5"/>
      <circle cy="-24" r="5" fill="var(--surface)"/></g>`});
  let me="";
  if(here){const [x,y]=px(here.lat,here.lng);me=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="16" fill="var(--leaf)" opacity=".3"><animate attributeName="r" values="10;18;10" dur="2.4s" repeatCount="indefinite"/></circle><circle r="7" fill="var(--green)" stroke="var(--surface)" stroke-width="3"/></g>`;}
  return `<svg class="map" viewBox="0 0 ${MW} ${MH}" role="img" aria-label="Mapa de puntos de reciclaje en Medellín">
    <rect width="${MW}" height="${MH}" fill="var(--sand)"/>
    <path d="M0 0h70c-10 80 10 160-5 240s10 140-10 200H0z" fill="var(--leaf)" opacity=".28"/>
    <path d="M${MW} 0h-80c12 70-8 150 8 230s-5 150 12 210h60z" fill="var(--leaf)" opacity=".28"/>
    <path d="M0 0h40c-6 90 6 180-4 260s6 120-6 180H0z" fill="var(--leaf)" opacity=".3"/>
    <path d="M${MW} 0h-45c8 80-6 170 6 250s-4 130 8 190h31z" fill="var(--leaf)" opacity=".3"/>
    ${line([6.300,-75.598],[6.200,-75.597])}${line([6.250,-75.635],[6.250,-75.566])}${line([6.240,-75.568],[6.168,-75.575])}${line([6.300,-75.555],[6.205,-75.560])}${line([6.232,-75.630],[6.232,-75.578])}
    <path d="${rd}" stroke="#6E9FB0" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/>
    ${(()=>{const p=px(6.188,-75.594);return `<text x="${p[0]+8}" y="${p[1]}" font-size="9" font-style="italic" fill="#4E7F8E">Río Medellín</text>`})()}
    ${labels}${me}${pins}
  </svg>`;
}
function sortedPoints(){
  return POINTS.map(p=>({...p,d:here?km(here,p):null})).sort((a,b)=>a.d==null?0:a.d-b.d);
}
function map(){
  const opts=BARRIOS.map((b,i)=>`<option value="${i}" ${here&&here.label===b[0]?"selected":""}>${b[0]}</option>`).join("");
  const list=sortedPoints().map((p,i)=>{
    const ph=S.photos[p.id]||IMG.kiosk; const visited=S.visits.some(v=>v.id===p.id);
    return `<button class="place" data-id="${p.id}"><img src="${ph}" alt=""><div style="min-width:0"><b>${esc(p.name)}${visited?`<span class="done" title="Visitado">${ICON.check.replace('<svg','<svg width="16" height="16"')}</span>`:""}</b><small>${esc(p.zone)}${i===0&&here?" · El más cercano":""}</small></div><span class="d">${p.d!=null?fmtKm(p.d):""}</span></button>`}).join("");
  return `
  <div><p class="eyebrow">GPS</p><h1 class="title">Puntos verdes en Medellín</h1><p class="lead">Toca un punto para ver su foto, dirección y qué recibe.</p></div>
  <div class="mapcard">${mapSVG()}
    <div class="locbar">
      <button class="btn primary" id="locBtn">${ICON.gps} Usar mi ubicación</button>
      <select id="barrio" aria-label="Elige tu barrio"><option value="">o elige tu barrio…</option>${opts}</select>
      <p class="msg" id="locMsg" ${here?"":"hidden"}>${here?`Ordenados desde: <b>${esc(here.label)}</b>`:""}</p>
    </div>
  </div>
  <div class="list">${list}</div>
  <p class="disclaimer">Puntos Naranja y punto fijo de Emvarias según reportes de Telemedellín y El Colombiano. Las ubicaciones son aproximadas: confirma horario antes de ir.</p>`;
}
after.map=()=>{
  document.querySelectorAll(".pin,.place").forEach(el=>{
    el.onclick=()=>openPoint(el.dataset.id);
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openPoint(el.dataset.id)}};
  });
  $("#barrio").onchange=e=>{const b=BARRIOS[e.target.value];if(!b)return;here={lat:b[1],lng:b[2],label:b[0]};render();};
  $("#locBtn").onclick=locate;
};
function locate(){
  const msg=$("#locMsg"); msg.hidden=false; msg.textContent="Buscando tu ubicación…";
  if(!("geolocation" in navigator)){msg.textContent="Tu navegador no tiene GPS. Elige tu barrio en la lista.";return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    here={lat:pos.coords.latitude,lng:pos.coords.longitude,label:"tu ubicación"};
    const near=sortedPoints()[0]; render(); toast("El punto más cercano está a "+fmtKm(near.d));
  },()=>{msg.textContent="No pudimos usar tu ubicación. Revisa el permiso de ubicación o elige tu barrio en la lista.";},{enableHighAccuracy:true,timeout:9000,maximumAge:60000});
}

/* ---- Ficha del punto ---- */
function openPoint(id){
  const p=POINTS.find(x=>x.id===id); curPoint=p; const d=here?km(here,p):null;
  const own=S.photos[p.id];
  const visitedToday=S.visits.some(v=>v.id===p.id&&v.date===today());
  const veil=document.createElement("div"); veil.className="veil";
  veil.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
    <button class="closebtn" aria-label="Cerrar">${ICON.xx.replace('<svg','<svg width="18" height="18"')}</button>
    <div class="grab"></div>
    <div class="sheet-body">
      <div class="photo"><img src="${own||IMG.kiosk}" alt="Foto de ${esc(p.name)}"><span class="tag">${own?"Tu foto del lugar":"Foto de referencia"}</span></div>
      <div><p class="eyebrow">${d!=null?"A "+fmtKm(d)+" · ":""}${esc(p.zone)}</p><h2 style="font-size:25px">${esc(p.name)}</h2></div>
      <div class="addr">${ICON.pin}<div><b>${esc(p.zone)}</b><br><a href="${mapsUrl(p)}" target="_blank" rel="noopener">Ver dirección en Google Maps</a></div></div>
      <div><p class="eyebrow" style="margin:0 0 6px">Recibe</p><div class="chips">${p.takes.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>
      <div class="row">
        <a class="btn ghost" href="${dirUrl(p)}" target="_blank" rel="noopener">${ICON.route} Cómo llegar</a>
        <button class="btn primary" id="shootBtn" ${visitedToday?"disabled style='opacity:.6'":""}>${ICON.cam} ${visitedToday?"Ya ganaste hoy aquí":"Ya llegué: tomar foto"}</button>
      </div>
      <p class="msg">${visitedToday?"Vuelve mañana o visita otro punto para seguir sumando.":"Cuando estés en el punto, toma una foto del lugar y ganas 1 punto."}</p>
    </div></div>`;
  document.body.appendChild(veil);
  const close=()=>{veil.remove();document.removeEventListener("keydown",onKey)};
  const onKey=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",onKey);
  veil.onclick=e=>{if(e.target===veil)close()};
  veil.querySelector(".closebtn").onclick=close;
  const sb=veil.querySelector("#shootBtn"); if(!visitedToday) sb.onclick=()=>{ $("#camera").value=""; $("#camera").click(); };
  veil.querySelector(".closebtn").focus();
}
$("#camera").onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f||!curPoint) return;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement("canvas"),s=Math.min(1,480/Math.max(im.width,im.height));
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const data=c.toDataURL("image/jpeg",.7);
    S.photos[curPoint.id]=data;
    S.visits.unshift({id:curPoint.id,name:curPoint.name,date:today()});
    addPoints(1);
    document.querySelectorAll(".veil").forEach(v=>v.remove());
    lastShot=data; go("done");
  };im.onerror=()=>toast("No pudimos leer la foto. Intenta de nuevo.");im.src=fr.result;};
  fr.readAsDataURL(f);
};
let lastShot=null;

/* ---- Cierre / despedida ---- */
function done(){
  return `<div class="screen done-screen" style="gap:14px">
    <p class="big-plus">+1 punto</p>
    ${lastShot?`<img class="shot" src="${lastShot}" alt="Tu foto del punto verde">`:""}
    <h2>¡Gracias por reciclar!</h2>
    <p class="lead" style="max-width:32ch">Llevas <b>${S.points}</b> ${S.points===1?"punto":"puntos"}. Nivel ${LEVELS[level(S.points)][0]}.</p>
    <div class="ring">${RECYCLE}</div>
    <h2 style="font-size:28px;color:var(--brown)">Te esperamos. Vuelve pronto</h2>
    <div class="row" style="width:100%"><button class="btn ghost" data-go="me">Ver mis puntos</button><button class="btn primary" data-go="home">Ir al inicio</button></div>
  </div>`;
}
after.done=()=>document.querySelectorAll("#main [data-go]").forEach(b=>b.onclick=()=>{history=[];go(b.dataset.go,false)});

  return `

    <div class="controls"><button id="pp" aria-label="Reproducir">${ICON.play}</button><div class="bar"><i id="barI"></i></div><span class="time" id="tm">0:00</span></div>
  </div>
  <div class="vids">${vids}</div>
  <a class="btn ghost block" href="${YT_MORE}" target="_blank" rel="noopener">Ver más videos en YouTube</a>`;
}
after.learn=()=>{
  document.querySelectorAll(".vid").forEach(b=>b.onclick=()=>{curVid=+b.dataset.i;if(player)player.stop();render();player.play();});
  player=makePlayer(VIDEOS[curVid]);
};
function makePlayer(v){
  const total=v.scenes.length*SCENE_MS; let t=0, timer=null, last=-1;
  const stage=$("#stage"), pp=$("#pp"), bar=$("#barI"), tm=$("#tm");
  const fmt=ms=>{const s=Math.floor(ms/1000);return "0:"+String(s).padStart(2,"0")};
  function scene(i){
    if(i===last)return; last=i; const sc=v.scenes[i];
    stage.innerHTML=`<div class="scene" style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;height:100%;justify-content:center"><div class="art">${sc.a.map(artSVG).join("")}</div><p>${esc(sc.t)}</p></div>`;
  }
  function paint(){bar.style.width=(t/total*100)+"%";tm.textContent=fmt(t);scene(Math.min(v.scenes.length-1,Math.floor(t/SCENE_MS)));}
  function cover(label){
    const b=document.createElement("button");b.className="startover";b.setAttribute("aria-label",label);
    b.innerHTML=`<span>${label==="Repetir"?ICON.replay:ICON.play}</span>`;b.onclick=()=>{if(t>=total)t=0;api.play()};stage.appendChild(b);
  }
  const api={
    play(){ if(timer)return; if(t>=total)t=0; stage.querySelector(".startover")?.remove(); pp.innerHTML=ICON.pause;pp.setAttribute("aria-label","Pausar");
      timer=setInterval(()=>{t+=200;if(t>=total){t=total;paint();api.pause(true);return;}paint();},200);},
    pause(ended){ clearInterval(timer);timer=null;pp.innerHTML=ICON.play;pp.setAttribute("aria-label","Reproducir");
      if(ended){ if(!S.videos.includes(v.id)){S.videos.push(v.id);addPoints(1);toast("¡Video completo! +1 punto");
          const sm=document.querySelector(`.vid[data-i="${curVid}"] small`); if(sm) sm.innerHTML=esc(v.sub)+' · 0:25 · <span class="ok">Visto +1</span>';}
        cover("Repetir"); } },
    stop(){clearInterval(timer);timer=null;}
  };
  pp.onclick=()=>timer?api.pause():api.play();
  paint(); cover("Reproducir"); return api;
}

/* ============ CATEGORÍAS ============ */
let openCat=null;
function cats(){
  if(openCat) return catDetail(CATS.find(c=>c.id===openCat));
  const codes=CODES.map(c=>`<div class="code">${binSVG(c.k,c.name)}<b>${c.name}</b><span>${c.text}</span></div>`).join("");
  const cards=CATS.map(c=>`<button class="cat" data-id="${c.id}"><div class="img">${c.img?`<img src="${IMG[c.img]}" alt="${esc(c.name)}">`:`<div class="sv">${binSVG(c.bin)}</div>`}</div>
    <div class="cap"><b>${esc(c.name)}</b><small><span class="sw" style="background:${c.bin==="naranja"?"var(--bin-orange)":`var(--bin-${c.bin==="blanca"?"white":c.bin==="verde"?"green":"black"})`}"></span>${c.bin==="naranja"?"Punto Naranja":"Caneca "+c.bin}</small></div></button>`).join("");
  return `
  <div><p class="eyebrow">Categorías</p><h1 class="title">¿Esto se recicla?</h1><p class="lead">Escribe un residuo y te decimos dónde va.</p></div>
  <div class="search">${ICON.search}<input id="q" type="search" placeholder="Ej: caja de pizza, pilas, icopor" autocomplete="off" aria-label="Buscar residuo"></div>
  <div class="answer" id="ans" hidden></div>
  <div><p class="eyebrow" style="margin:0 0 8px">Código de colores en Colombia</p><div class="codes">${codes}</div></div>
  <div><p class="eyebrow" style="margin:0 0 8px">Por material</p><div class="cats">${cards}</div></div>`;
}
function catDetail(c){
  return `
  <div class="cat" style="cursor:default"><div class="img" style="aspect-ratio:4/3">${c.img?`<img src="${IMG[c.img]}" alt="${esc(c.name)}">`:`<div class="sv">${binSVG(c.bin)}</div>`}</div></div>
  <div><p class="eyebrow">${c.bin==="naranja"?"Llévalo a un Punto Naranja":"Va en la caneca "+c.bin}</p><h1 class="title">${esc(c.name)}</h1></div>
  <div class="yesno">
    <div class="yn y"><h3>${ICON.check.replace('<svg','<svg width="18" height="18"')} Sí va</h3><ul>${c.yes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="yn n"><h3>${ICON.xx.replace('<svg','<svg width="18" height="18"')} No va</h3><ul>${c.no.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  </div>
  <p class="tip">${esc(c.tip)}</p>
  ${c.bin==="naranja"?`<button class="btn primary block" data-go="map">${ICON.pin} Ver Puntos Naranja</button>`:""}
  <button class="btn ghost block" id="allCats">Ver todas las categorías</button>`;
}
after.cats=()=>{
  if(openCat){
    $("#allCats").onclick=()=>{openCat=null;render()};
    document.querySelectorAll("#main [data-go]").forEach(b=>b.onclick=()=>{openCat=null;go(b.dataset.go)});
    return;
  }
  document.querySelectorAll(".cat[data-id]").forEach(b=>b.onclick=()=>{openCat=b.dataset.id;render();window.scrollTo(0,0)});
  const q=$("#q"),ans=$("#ans");
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  q.oninput=()=>{
    const v=norm(q.value.trim()); if(v.length<2){ans.hidden=true;return;}
    const hits=ITEMS.filter(i=>norm(i[0]).includes(v)).slice(0,4);
    ans.hidden=false;
    if(!hits.length){ans.innerHTML=`<p style="margin:0">No lo tenemos en la lista. <a href="${waUrl("Hola EcoBot, ¿dónde va: "+q.value+"?")}" target="_blank" rel="noopener">Pregúntale a EcoBot</a>.</p>`;return;}
    ans.innerHTML=hits.map(([n,cid])=>{
      if(cid==="farmacia") return `<div class="ans"><span class="dot">${binSVG("blanca")}</span><div><b>${esc(n)}</b><small>Llévalos a un Punto Azul en farmacias y droguerías.</small></div></div>`;
      const c=CATS.find(x=>x.id===cid);
      return `<button class="ans" data-id="${c.id}" style="background:none;border:0;padding:0;text-align:left"><span class="dot">${binSVG(c.bin)}</span><div><b>${esc(n)}</b><small>${c.bin==="naranja"?"Punto Naranja":"Caneca "+c.bin} · ${esc(c.name)}</small></div></button>`}).join("");
    ans.querySelectorAll("button.ans").forEach(b=>b.onclick=()=>{openCat=b.dataset.id;render();window.scrollTo(0,0)});
  };
};

/* ============ ECOBOT (WhatsApp) ============ */
function bot(){
  const qs=["¿Qué va en la caneca blanca?","¿La caja de pizza se recicla?","¿Qué hago con las pilas?","¿Dónde llevo el aceite de cocina usado?","¿Cómo gano puntos en EcoPoint?"];
  return `
  <div><p class="eyebrow">EcoBot</p><h1 class="title">Pregunta lo que quieras sobre reciclaje</h1><p class="lead">EcoBot te responde por WhatsApp, a cualquier hora.</p></div>
  <div class="chat" aria-label="Ejemplo de conversación">
    <p class="lbl">Ejemplo de conversación</p>
    <div class="bub me">Hola, ¿el icopor se recicla?</div>
    <div class="bub bot">¡Hola! Si está limpio, sí: va en la caneca blanca. Si tiene restos de comida, va en la negra.</div>
    <div class="bub me">¿Y las pilas?</div>
    <div class="bub bot">Las pilas nunca van a la basura. Llévalas a un Punto Naranja. ¿Te muestro el más cercano?</div>
  </div>
  <a class="btn brown block" href="${waUrl("Hola EcoBot, tengo una pregunta sobre reciclaje.")}" target="_blank" rel="noopener">${ICON.wa} Abrir chat en WhatsApp</a>
  <div><p class="eyebrow" style="margin:0 0 8px">Preguntas rápidas</p><div class="qs">${qs.map(q=>`<a class="q" href="${waUrl(q)}" target="_blank" rel="noopener">${esc(q)}${ICON.arrow}</a>`).join("")}</div></div>
  <div class="numbox">Número de EcoBot: <code>+${WHATSAPP_NUMBER}</code></div>`;
}

/* ============ MIS PUNTOS ============ */
let confirmReset=false;
function me(){
  const li=level(S.points), next=LEVELS[li+1];
  const pct=next?Math.round((S.points-LEVELS[li][1])/(next[1]-LEVELS[li][1])*100):100;
  const lv=LEVELS.map((l,i)=>`<div class="lvl ${i===li?"on":""}"><b>${l[0]}</b>${l[1]}+ pts</div>`).join("");
  const seen=new Set(); const gal=S.visits.filter(v=>{if(seen.has(v.id))return false;seen.add(v.id);return true;})
    .map(v=>`<figure><img src="${S.photos[v.id]||IMG.kiosk}" alt=""><figcaption>${esc(v.name)}<br>${v.date}</figcaption></figure>`).join("");
  return `
  <div><p class="eyebrow">Mis puntos</p><h1 class="title">Tu huella verde</h1><p class="lead">Sin cuenta: tus puntos se guardan en este celular.</p></div>
  <div class="score"><span class="n">${S.points}</span><div style="flex:1;min-width:0"><span class="lv">Nivel ${LEVELS[li][0]}</span><br><small>${next?`Te faltan ${next[1]-S.points} para ${next[0]}`:"¡Llegaste al nivel más alto!"}</small><div class="prog"><i style="width:${pct}%"></i></div></div></div>
  <div class="levels">${lv}</div>
  <div><p class="eyebrow" style="margin:0 0 8px">Puntos verdes visitados (${S.visits.length} ${S.visits.length===1?"visita":"visitas"})</p>
  ${gal?`<div class="gallery">${gal}</div>`:`<div class="empty">Aún no has visitado puntos. Abre el GPS, ve a un punto y tómale una foto.<br><br><button class="btn primary" data-go="map">${ICON.pin} Abrir GPS</button></div>`}</div>
  <p class="msg">Videos vistos: ${S.videos.length} de ${VIDEOS.length}</p>
  <div class="confirm">${confirmReset?`<span>¿Borrar todos tus puntos y fotos?</span><button class="btn brown" id="yesReset">Sí, borrar</button><button class="btn ghost" id="noReset">Cancelar</button>`:`<button class="btn ghost" id="reset">Borrar mis datos</button>`}</div>`;
}
after.me=()=>{
  document.querySelectorAll("#main [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const r=$("#reset"); if(r) r.onclick=()=>{confirmReset=true;render()};
  const y=$("#yesReset"); if(y) y.onclick=()=>{S={points:0,visits:[],videos:[],photos:{}};save();confirmReset=false;render();toast("Datos borrados")};
  const n=$("#noReset"); if(n) n.onclick=()=>{confirmReset=false;render()};
};

render();
</script>
